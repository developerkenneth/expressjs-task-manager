<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Task Manager</title>
</head>

<body>

    <main>

        <!--  -->
        <section>
            <div class="container">
                <h1 class="title">Task Manager 2026</h1>
                <form action="">
                    <div class="inputs-container">
                        <div class="form-input">
                            <input type="text" id="task" placeholder="Enter a task">
                        </div>

                        <div class="form-input">
                            <button class="btn" type="submit">save task</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <section>
            <div class="container">
                <h1 class="title">Your Task</h1>
                <!-- task list -->
                <ul>
                    <li class="completed"><span>task</span>



                        <div class="icons">
                            <span class="del">
                                <img width="24px" src="./images/del.svg" alt="delete"></span>

                            <!-- edit btn -->
                            <a href="#"><img width="24px"  src="./images/edit.svg" alt="edit"></a>
                        </div>

                    </li>
                </ul>
            </div>
        </section>

    </main>
    <script type="module" src="js/app.js"></script>
</body>

</html>
